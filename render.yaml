services:
  - type: web
    name: ruth-admin-panel
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run verify:deploy:admin
    preDeployCommand: npm run verify:production-infra
    startCommand: npm run start:admin
    healthCheckPath: /api/health/render
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RUTH_ADMIN_CONTINUITY_SECRET
        sync: false
      - key: NEXT_PUBLIC_STOREFRONT_URL
        sync: false
      - key: WEBSITE_REVALIDATE_SECRET
        sync: false
      - key: BASIT_KARGO_API_TOKEN
        sync: false
      - key: BASIT_KARGO_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

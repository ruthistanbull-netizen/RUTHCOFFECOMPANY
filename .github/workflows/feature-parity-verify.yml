name: Feature Parity Verify

on:
  push:
    branches:
      - feat/exact-ruth-commerce-panel-transplant
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Admin typecheck
        run: npm --prefix apps/admin run typecheck:app
      - name: Storefront typecheck
        run: npm --prefix apps/storefront run typecheck
      - name: Admin build
        run: npm --prefix apps/admin run build
      - name: Storefront build
        run: npm --prefix apps/storefront run build

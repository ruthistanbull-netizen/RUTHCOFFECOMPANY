name: ROSTA Admin + Storefront Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fposvxuryzidmeuwytbg.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6Zoqk9z0WEDsvNZ79-b2Qw_fnKVuWhb
      NEXT_PUBLIC_STORE_URL: https://rostacoffecompany.zeabur.app
      NEXT_PUBLIC_SITE_URL: https://rostacoffecompany.zeabur.app
      NEXT_PUBLIC_PANEL_URL: https://rostapanel.zeabur.app
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
      REVALIDATE_SECRET: ci-placeholder-revalidate
      WEBSITE_REVALIDATE_SECRET: ci-placeholder-revalidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck:admin
      - run: npm run typecheck:storefront
      - run: npm run build:admin
      - run: npm run build:storefront
